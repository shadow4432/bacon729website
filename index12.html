<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bacon729</title>
<style>
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        min-height: 100%;
    }

    body {
        min-height: 100vh;
        background: #eef2f5;
        font-family: Arial, Helvetica, sans-serif;
        overflow-x: hidden;
    }

    .hero {
        position: relative;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        overflow: hidden;
    }

    /* Your uploaded artwork */
    .art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
    }

    /*
      This title is intentionally moved upward.
      Change -55px to -80px, -100px, etc. to move it higher.
    */
    .title {
        position: absolute;
        top: 26%;
        left: 50%;
        transform: translate(-50%, -50%);
        margin: 0;
        z-index: 2;

        font-family: "Arial Black", Impact, sans-serif;
        font-size: clamp(48px, 8vw, 105px);
        font-weight: 900;
        letter-spacing: -3px;
        color: #050505;
        text-shadow: 2px 2px 0 #111;
        white-space: nowrap;
    }

    .content {
        position: relative;
        z-index: 3;
        width: min(900px, 90%);
        margin-top: 62vh;
        text-align: center;
    }

    .content h2 {
        font-size: clamp(28px, 5vw, 58px);
        margin: 0 0 20px;
        color: #050505;
        font-family: "Arial Black", Impact, sans-serif;
    }

    .content p {
        font-size: clamp(18px, 2.5vw, 28px);
        font-weight: 700;
        color: #111;
    }

    .socials {
        display: flex;
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 20px;
    }

    .socials a {
        padding: 12px 20px;
        border-radius: 12px;
        background: #111;
        color: white;
        text-decoration: none;
        font-weight: bold;
        transition: transform .15s ease, opacity .15s ease;
    }

    .socials a:hover {
        transform: translateY(-3px);
        opacity: .85;
    }

    @media (max-width: 700px) {
        .title {
            top: 22%;
        }

        .content {
            margin-top: 60vh;
        }
    }
</style>
</head>
<body>
<main class="hero">
    <img class="art" src="background.jpg" alt="bacon729 website artwork">

    <h1 class="title">bacon729</h1>

    <section class="content">
        <h2>Welcome to my website :D</h2>
        <p>here are my socials if you wanna follow me:</p>

        <div class="socials">
            <!-- Replace these with your real links -->
            <a href="#" target="_blank">YouTube</a>
            <a href="#" target="_blank">Discord</a>
            <a href="#" target="_blank">GitHub</a>
        </div>
    </section>
</main>
</body>
</html>
